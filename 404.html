<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found · DorkForge</title>
<meta name="robots" content="noindex, follow" />
<meta name="description" content="This page doesn't exist. Head back to DorkForge, the free Google dork builder." />
<meta name="theme-color" content="#0b1220" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<style>
  :root{--bg:#eef2f8;--surface:#fff;--edge:#dde5f0;--ink:#16233c;--muted:#5b6b86;--faint:#93a1bb;--signal:#0d8ba0;--ring:rgba(13,139,160,.15);--val:#0f7a45;--neg:#c0492e}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1220;--surface:#141d30;--edge:#25324a;--ink:#e8eefb;--muted:#93a3c0;--faint:#5f6f8e;--signal:#2fbdd4;--ring:rgba(47,189,212,.22);--val:#4fd08a;--neg:#f2896b}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);
    background:radial-gradient(640px 320px at 90% -8%,var(--ring),transparent 62%),var(--bg);text-align:center}
  .card{max-width:440px;width:100%}
  .code{font-size:clamp(4rem,18vw,6.5rem);font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--signal)}
  h1{font-size:1.35rem;margin:.6rem 0 .4rem}
  p{color:var(--muted);line-height:1.6;margin:0 0 1.3rem;font-size:.95rem}
  pre{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.85rem;text-align:left;white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--edge);border-left:3px solid var(--signal);border-radius:12px;padding:.8rem .9rem;margin:0 0 1.4rem}
  .op{color:var(--signal)}.v{color:var(--val)}.n{color:var(--neg)}
  a.btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--signal);color:#fff;text-decoration:none;font-weight:700;padding:.8rem 1.3rem;border-radius:12px;box-shadow:0 2px 12px var(--ring)}
</style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>No results for this page</h1>
    <p>Even the sharpest dork can't find a page that doesn't exist.</p>
    <pre><span class="op">site:</span><span class="v">dorkforge.github.io</span> <span class="op">inurl:</span><span class="v">this-page</span> <span class="n">-exists</span></pre>
    <a class="btn" href="/">← Back to DorkForge</a>
  </main>
</body>
</html>
